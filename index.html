<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe Online</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-container">
      <h1>Tic-Tac-Toe</h1>
      <p id="status" aria-live="polite">Turno de: X</p>

      <section class="board" aria-label="Tablero de tres en raya">
        <button class="cell" data-cell="0" aria-label="Celda 1"></button>
        <button class="cell" data-cell="1" aria-label="Celda 2"></button>
        <button class="cell" data-cell="2" aria-label="Celda 3"></button>
        <button class="cell" data-cell="3" aria-label="Celda 4"></button>
        <button class="cell" data-cell="4" aria-label="Celda 5"></button>
        <button class="cell" data-cell="5" aria-label="Celda 6"></button>
        <button class="cell" data-cell="6" aria-label="Celda 7"></button>
        <button class="cell" data-cell="7" aria-label="Celda 8"></button>
        <button class="cell" data-cell="8" aria-label="Celda 9"></button>
      </section>

      <button id="reset" class="reset-btn">Reiniciar partida</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
